<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroRepara — Retro Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050a0a;
      font-family: "JetBrains Mono", "Courier New", monospace;
      color: #00d4ff;
      overflow: hidden;
    }

    #backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #game {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    #idle-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }

    #idle-overlay .game-title {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: #00d4ff;
      text-shadow: 0 0 12px rgba(0,212,255,0.7);
      opacity: 0;
      animation: fadeIn 0.8s ease 0.3s forwards;
    }

    #idle-overlay .loading-bar-wrap {
      width: 180px;
      height: 3px;
      background: rgba(0,212,255,0.15);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.5s forwards;
    }

    #idle-overlay .loading-bar {
      height: 100%;
      width: 0%;
      background: #00d4ff;
      border-radius: 2px;
      animation: loadBar 1.8s ease 0.6s forwards;
      box-shadow: 0 0 8px rgba(0,212,255,0.8);
    }

    #idle-overlay .hint {
      font-size: 0.7rem;
      color: rgba(0,212,255,0.4);
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.2s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes loadBar {
      0%   { width: 0%; }
      60%  { width: 85%; }
      100% { width: 100%; }
    }

    #error-box {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
      color: #ff4444;
      font-size: 0.95rem;
      z-index: 99;
    }

    #error-box h2 {
      margin: 0;
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(255,68,68,0.6);
    }

    #error-box p {
      margin: 0;
      color: rgba(255,100,100,0.8);
    }

    #error-box small {
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<canvas id="backdrop"></canvas>

<div id="idle-overlay">
  <div class="game-title" id="game-title-label">INICIANDO...</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar"></div>
  </div>
  <div class="hint">ELECTROREPARA — RETRO ENGINE</div>
</div>

<div id="error-box">
  <h2>⚠ ROM NO ENCONTRADA</h2>
  <p id="error-msg">No se pudo cargar el archivo solicitado.</p>
  <small>Verifica que el archivo exista en /public/roms/ con el nombre correcto.</small>
</div>

<div id="game"></div>

<script>
  const canvas = document.getElementById('backdrop');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => canvas.width;
  const H = () => canvas.height;

  const stars = Array.from({length: 130}, () => ({
    x:     Math.random(),
    y:     Math.random(),
    r:     Math.random() * 1.4 + 0.3,
    speed: Math.random() * 0.4 + 0.05,
    alpha: Math.random() * 0.5 + 0.4
  }));

  const floaters = Array.from({length: 22}, () => ({
    x:     Math.random(),
    y:     Math.random(),
    size:  (Math.floor(Math.random() * 3) + 1) * 5,
    color: ['#00d4ff','#00ff80','#ff4dff','#ffcc00','#ff6b35','#00ffcc'][Math.floor(Math.random()*6)],
    vx:   (Math.random() - 0.5) * 0.00035,
    vy:   (Math.random() - 0.5) * 0.00035,
    alpha: Math.random() * 0.4 + 0.15
  }));

  let t = 0;

  function drawGrid() {
    const step = 40;
    ctx.strokeStyle = 'rgba(0,180,255,0.055)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W(); x += step) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H()); ctx.stroke();
    }
    for (let y = 0; y < H(); y += step) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W(),y); ctx.stroke();
    }
  }

  function drawStars() {
    stars.forEach(s => {
      const pulse = (Math.sin(t * s.speed * 0.05 + s.x * 10) + 1) / 2;
      ctx.beginPath();
      ctx.arc(s.x * W(), s.y * H(), s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,230,255,${s.alpha * (0.3 + pulse * 0.7)})`;
      ctx.fill();
    });
  }

  function drawFloaters() {
    floaters.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -0.05) p.x = 1.05;
      if (p.x > 1.05)  p.x = -0.05;
      if (p.y < -0.05) p.y = 1.05;
      if (p.y > 1.05)  p.y = -0.05;
      const pulse = (Math.sin(t * 0.018 + p.x * 8) + 1) / 2;
      ctx.globalAlpha = p.alpha * (0.25 + pulse * 0.55);
      ctx.fillStyle   = p.color;
      ctx.fillRect(Math.round(p.x * W()), Math.round(p.y * H()), p.size, p.size);
      ctx.globalAlpha = 1;
    });
  }

  function drawGlow() {
    const pulse = (Math.sin(t * 0.012) + 1) / 2;
    const gx = W() / 2, gy = H() / 2, gr = W() * 0.65;
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    grad.addColorStop(0,   `rgba(0,160,90,${0.025 + pulse * 0.035})`);
    grad.addColorStop(0.5, `rgba(0,80,180,${0.015 + pulse * 0.02})`);
    grad.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W(), H());
  }

  function drawScanlines() {
    for (let y = 0; y < H(); y += 4) {
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(0, y, W(), 2);
    }
  }

  function drawCorners() {
    const len = 22, pad = 18;
    const pts = [
      [pad, pad, 1, 1],
      [W()-pad, pad, -1, 1],
      [pad, H()-pad, 1, -1],
      [W()-pad, H()-pad, -1, -1]
    ];
    ctx.strokeStyle = 'rgba(0,212,255,0.22)';
    ctx.lineWidth = 1.5;
    pts.forEach(([cx, cy, dx, dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx, cy + dy * len);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx + dx * len, cy);
      ctx.stroke();
    });
  }

  function loop() {
    t++;
    ctx.fillStyle = '#050a0a';
    ctx.fillRect(0, 0, W(), H());
    drawGrid();
    drawGlow();
    drawStars();
    drawFloaters();
    drawScanlines();
    drawCorners();
    requestAnimationFrame(loop);
  }
  loop();

  // ── Emulador ───────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const rom    = params.get('rom');
  const system = params.get('system');

  const GAME_NAMES = {
    'doom.gba':  'DOOM',
    'dkc.gba':   'DONKEY KONG COUNTRY',
    'smas.sfc':  'SUPER MARIO ALL-STARS',
    'mk2.sfc':   'MORTAL KOMBAT II',
    'ssf2.smc':  'SUPER STREET FIGHTER II',
  };

  if (rom && GAME_NAMES[rom]) {
    document.getElementById('game-title-label').textContent = GAME_NAMES[rom];
  }

  function showError(msg) {
    document.getElementById('idle-overlay').style.display = 'none';
    const box = document.getElementById('error-box');
    box.style.display = 'flex';
    document.getElementById('error-msg').textContent = msg;
  }

  async function verifyROM(filename) {
    try {
      const res = await fetch(`/roms/${filename}`, { method: 'HEAD' });
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  function bootEmulator(rom, system) {
    window.EJS_player      = '#game';
    window.EJS_core        = system;
    window.EJS_gameUrl     = `/roms/${rom}`;
    window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';

    window.EJS_onGameStart = () => {
      document.getElementById('idle-overlay').style.display = 'none';
    };

    const script   = document.createElement('script');
    script.src     = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    script.onerror = () => showError('Error al conectar con EmulatorJS CDN. Verifica tu conexión.');
    document.body.appendChild(script);
  }

  if (!rom || !system) {
    showError("Parámetros 'rom' o 'system' faltantes en la URL.");
  } else {
    verifyROM(rom).then(exists => {
      if (!exists) {
        showError(`Archivo "${rom}" no encontrado en /public/roms/`);
        return;
      }
      bootEmulator(rom, system);
    });
  }
</script>

</body>
</html>
